<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LiteLearning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="./assets.css">
  <style>
    .input-icon-wrap {
      position: relative;
    }
    .input-icon-wrap .input {
      padding-left: 40px;
    }
    .input-icon-wrap .icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-gray-400);
      pointer-events: none;
    }
    .demo-box {
      background: var(--color-gray-50);
      border: 1px solid var(--color-gray-200);
      border-radius: var(--border-radius-lg);
      padding: 16px;
      margin-top: 24px;
    }
    .demo-box-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-gray-500);
      margin-bottom: 8px;
    }
    .demo-box p {
      font-size: 12px;
      color: var(--color-gray-600);
      margin: 4px 0;
    }
    .logo-animate {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo logo-animate">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your account to continue</p>
      </div>
      
      <form>
        <div class="form-group">
          <label class="form-label">Email address</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-envelope icon"></i>
            <input type="email" class="input" placeholder="you@example.com">
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-lock icon"></i>
            <input type="password" class="input" placeholder="••••••••">
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-check">
            <input type="checkbox" class="checkbox">
            <span class="form-check-label">Remember me</span>
          </label>
        </div>
        
        <button type="submit" class="btn btn-primary btn-lg w-full" style="margin-top: 8px;">
          Sign in
        </button>
      </form>
      
      <div class="auth-footer">
        Don't have an account? <a href="./register.html">Create one</a>
      </div>
      
      <div class="demo-box">
        <div class="demo-box-title">Demo Accounts</div>
        <p><strong>Teacher:</strong> teacher@litelearning.com / password</p>
        <p><strong>Student:</strong> student@litelearning.com / password</p>
        <p><strong>Admin:</strong> admin@litelearning.com / password</p>
      </div>
    </div>
  </div>
</body>
</html>
