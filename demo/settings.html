<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Settings Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen overflow-hidden bg-gray-50" style="font-family:'Google Sans Text','Google Sans','Noto Sans Thai',sans-serif;">
<div class="flex h-screen overflow-hidden">
  <aside class="hidden w-64 shrink-0 border-r border-gray-200 bg-white lg:flex lg:flex-col">
    <div class="flex h-16 items-center border-b border-gray-200 px-6"><div class="mr-2 flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-white"><i class="fa-solid fa-graduation-cap text-sm"></i></div><span class="text-lg font-bold text-gray-900">LiteLearning</span></div>
    <nav class="space-y-1 p-4 text-sm"><a class="flex items-center rounded-lg px-3 py-2.5 font-medium text-gray-700 hover:bg-gray-100" href="./dashboard.html"><i class="fa-solid fa-house mr-3 w-5 text-center"></i>Dashboard</a><a class="flex items-center rounded-lg px-3 py-2.5 font-medium text-gray-700 hover:bg-gray-100" href="./profile.html"><i class="fa-solid fa-user mr-3 w-5 text-center"></i>Profile</a><a class="flex items-center rounded-lg bg-indigo-50 px-3 py-2.5 font-medium text-indigo-700" href="./settings.html"><i class="fa-solid fa-gear mr-3 w-5 text-center"></i>Settings</a><p class="px-3 pt-4 text-xs font-semibold uppercase tracking-wider text-gray-400">Classes</p><a class="flex items-center rounded-lg px-3 py-2.5 font-medium text-gray-700 hover:bg-gray-100" href="./classroom-show.html"><i class="fa-solid fa-book-open mr-3 w-5 text-center"></i>Mathematics 101</a><a class="flex items-center rounded-lg px-3 py-2.5 font-medium text-gray-700 hover:bg-gray-100" href="./classroom-show.html"><i class="fa-solid fa-book-open mr-3 w-5 text-center"></i>Physics Advanced</a><a class="flex items-center rounded-lg px-3 py-2.5 font-medium text-gray-700 hover:bg-gray-100" href="./classroom-show.html"><i class="fa-solid fa-book-open mr-3 w-5 text-center"></i>English Literature</a></nav>
  </aside>
  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">
    <header class="h-16 shrink-0 border-b border-gray-200 bg-white px-6"><div class="flex h-full items-center justify-between"><h1 class="text-lg font-semibold text-gray-800">Settings</h1><div class="h-8 w-8 rounded-full bg-gray-200"></div></div></header>
    <main class="min-h-0 flex-1 overflow-y-auto p-6">
      <div class="mx-auto max-w-2xl">
        <h2 class="mb-6 text-2xl font-bold text-gray-900">Settings</h2>

        <div class="mb-6 rounded-xl border border-gray-200 bg-white p-6">
          <div class="flex items-start space-x-4">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-indigo-100"><i class="fa-solid fa-language text-indigo-600"></i></div>
            <div class="flex-1"><h3 class="text-lg font-semibold text-gray-900">Language</h3><p class="mt-1 text-sm text-gray-500">Choose your preferred language for the interface.</p>
              <div class="mt-4"><label class="mb-2 block text-sm font-medium text-gray-700">Select Language</label><button class="flex w-full items-center justify-between rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-700"><span class="flex items-center gap-2"><i class="fa-solid fa-language text-gray-500"></i><span>ไทย (Thai)</span></span><i class="fa-solid fa-chevron-down text-xs text-gray-400"></i></button><div class="mt-2 overflow-hidden rounded-lg border border-gray-200"><button class="flex w-full items-center justify-between bg-indigo-50 px-4 py-2 text-sm text-indigo-700"><span class="flex items-center gap-2"><i class="fa-solid fa-language w-4 text-center"></i><span>ไทย (Thai)</span></span><i class="fa-solid fa-check text-xs"></i></button><button class="flex w-full items-center justify-between px-4 py-2 text-sm text-gray-700 hover:bg-gray-50"><span class="flex items-center gap-2"><i class="fa-solid fa-language w-4 text-center"></i><span>English</span></span></button></div></div>
            </div>
          </div>
        </div>

        <div class="mb-6 rounded-xl border border-gray-200 bg-white p-6">
          <div class="flex items-start space-x-4">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-indigo-100"><i class="fa-solid fa-magnifying-glass-plus text-indigo-600"></i></div>
            <div class="flex-1"><h3 class="text-lg font-semibold text-gray-900">UI Size</h3><p class="mt-1 text-sm text-gray-500">Adjust interface zoom size for better readability.</p><div class="mt-4"><label class="mb-2 block text-sm font-medium text-gray-700">Select UI Size</label><div class="grid grid-cols-2 gap-2 sm:grid-cols-4"><button class="rounded-lg border border-gray-300 px-3 py-2.5 text-sm text-gray-700 hover:bg-gray-50">90%</button><button class="rounded-lg border border-indigo-600 bg-indigo-50 px-3 py-2.5 text-sm font-medium text-indigo-700">100%</button><button class="rounded-lg border border-gray-300 px-3 py-2.5 text-sm text-gray-700 hover:bg-gray-50">110%</button><button class="rounded-lg border border-gray-300 px-3 py-2.5 text-sm text-gray-700 hover:bg-gray-50">125%</button></div></div></div>
          </div>
        </div>

        <div class="rounded-xl border border-gray-200 bg-white p-6">
          <div class="flex items-start space-x-4">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-gray-100"><i class="fa-solid fa-user-circle text-gray-600"></i></div>
            <div class="flex-1"><h3 class="text-lg font-semibold text-gray-900">Account Settings</h3><div class="mt-4 space-y-4"><div><label class="block text-sm font-medium text-gray-500">Name</label><p class="mt-1 text-sm text-gray-900">Demo User</p></div><div><label class="block text-sm font-medium text-gray-500">Email</label><p class="mt-1 text-sm text-gray-900">demo@example.com</p></div><div><label class="block text-sm font-medium text-gray-500">Role</label><span class="mt-1 inline-flex items-center rounded-full bg-indigo-100 px-2.5 py-0.5 text-xs font-medium text-indigo-800">Teacher</span></div></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
