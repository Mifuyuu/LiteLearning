<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiteLearning Demo Pages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 antialiased" style="font-family:'Google Sans Text','Google Sans','Noto Sans Thai',sans-serif;">
  <div class="mx-auto min-h-screen max-w-6xl px-4 py-10 sm:px-6 lg:px-8">
    <div class="mb-8 text-center">
      <div class="mb-4 inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-indigo-600 shadow-lg">
        <i class="fa-solid fa-graduation-cap text-2xl text-white"></i>
      </div>
      <h1 class="text-3xl font-bold text-gray-900">LiteLearning</h1>
      <p class="mt-1 text-gray-500">Demo index for UI parity pages</p>
    </div>

    <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8">
      <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
        <section>
          <h2 class="mb-3 text-xs font-semibold uppercase tracking-wider text-gray-400">Auth</h2>
          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <a class="rounded-lg border border-gray-200 px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50" href="./login.html"><i class="fa-solid fa-right-to-bracket mr-2 text-gray-400"></i>Login</a>
            <a class="rounded-lg border border-gray-200 px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50" href="./register.html"><i class="fa-solid fa-user-plus mr-2 text-gray-400"></i>Register</a>
          </div>
        </section>

        <section>
          <h2 class="mb-3 text-xs font-semibold uppercase tracking-wider text-gray-400">Core</h2>
          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <a class="rounded-lg border border-gray-200 px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50" href="./dashboard.html"><i class="fa-solid fa-house mr-2 text-gray-400"></i>Dashboard</a>
            <a class="rounded-lg border border-gray-200 px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50" href="./classrooms.html"><i class="fa-solid fa-chalkboard mr-2 text-gray-400"></i>Classrooms</a>
            <a class="rounded-lg border border-gray-200 px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50" href="./calendar.html"><i class="fa-solid fa-calendar-days mr-2 text-gray-400"></i>Calendar</a>
            <a class="rounded-lg border border-gray-200 px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50" href="./to-review.html"><i class="fa-solid fa-clipboard-check mr-2 text-gray-400"></i>To Review</a>
            <a class="rounded-lg border border-gray-200 px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50" href="./profile.html"><i class="fa-solid fa-user mr-2 text-gray-400"></i>Profile</a>
            <a class="rounded-lg border border-gray-200 px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50" href="./settings.html"><i class="fa-solid fa-gear mr-2 text-gray-400"></i>Settings</a>
          </div>
        </section>

        <section class="lg:col-span-2">
          <h2 class="mb-3 text-xs font-semibold uppercase tracking-wider text-gray-400">Classroom & Assignment Flow</h2>
          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
            <a class="rounded-lg border border-gray-200 px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50" href="./classroom-show.html"><i class="fa-solid fa-users mr-2 text-gray-400"></i>Classroom Show</a>
            <a class="rounded-lg border border-gray-200 px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50" href="./classroom-people.html"><i class="fa-solid fa-user-group mr-2 text-gray-400"></i>Classroom People</a>
            <a class="rounded-lg border border-gray-200 px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50" href="./assignment-create.html"><i class="fa-solid fa-file-circle-plus mr-2 text-gray-400"></i>Assignment Create</a>
            <a class="rounded-lg border border-gray-200 px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50" href="./assignment-show.html"><i class="fa-solid fa-file-lines mr-2 text-gray-400"></i>Assignment Show</a>
            <a class="rounded-lg border border-gray-200 px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50" href="./assignment-grade.html"><i class="fa-solid fa-list-check mr-2 text-gray-400"></i>Assignment Grade</a>
          </div>
        </section>
      </div>
    </div>
  </div>
</body>
</html>
