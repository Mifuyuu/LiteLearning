<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - LiteLearning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="./assets.css">
  <style>
    .input-icon-wrap {
      position: relative;
    }
    .input-icon-wrap .input {
      padding-left: 40px;
    }
    .input-icon-wrap .icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-gray-400);
      pointer-events: none;
    }
    .logo-animate {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo logo-animate">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h1 class="auth-title">Create account</h1>
        <p class="auth-subtitle">Join LiteLearning to get started</p>
      </div>
      
      <form>
        <div class="form-group">
          <label class="form-label">Full name</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-user icon"></i>
            <input type="text" class="input" placeholder="John Doe">
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Email address</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-envelope icon"></i>
            <input type="email" class="input" placeholder="you@example.com">
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="input" placeholder="••••••••">
        </div>
        
        <div class="form-group">
          <label class="form-label">Confirm password</label>
          <input type="password" class="input" placeholder="••••••••">
        </div>
        
        <button type="submit" class="btn btn-primary btn-lg w-full" style="margin-top: 8px;">
          Create Account
        </button>
      </form>
      
      <div class="auth-footer">
        Already have an account? <a href="./login.html">Sign in</a>
      </div>
    </div>
  </div>
</body>
</html>
