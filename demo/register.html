<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 antialiased" style="font-family:'Google Sans Text','Google Sans','Noto Sans Thai',sans-serif;">
  <div class="flex min-h-screen flex-col items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
    <div class="mb-8 text-center">
      <div class="mb-4 inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-indigo-600 shadow-lg"><i class="fa-solid fa-graduation-cap text-2xl text-white"></i></div>
      <h1 class="text-3xl font-bold text-gray-900">LiteLearning</h1>
      <p class="mt-1 text-gray-500">Your modern learning platform</p>
    </div>
    <div class="w-full max-w-md">
      <div class="rounded-xl border border-gray-200 bg-white p-8 shadow-sm">
        <h2 class="mb-2 text-2xl font-bold text-gray-900">Create account</h2>
        <p class="mb-6 text-gray-500">Join LiteLearning to get started</p>
        <form class="space-y-5">
          <div><label class="mb-1 block text-sm font-medium text-gray-700">Full name</label><div class="relative"><i class="fa-solid fa-user pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i><input type="text" class="block w-full rounded-lg border border-gray-300 py-2.5 pl-10 pr-3 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500" placeholder="John Doe"></div></div>
          <div><label class="mb-1 block text-sm font-medium text-gray-700">Email address</label><div class="relative"><i class="fa-solid fa-envelope pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i><input type="email" class="block w-full rounded-lg border border-gray-300 py-2.5 pl-10 pr-3 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500" placeholder="you@example.com"></div></div>
          <div><label class="mb-2 block text-sm font-medium text-gray-700">I am a</label><div class="grid grid-cols-2 gap-3"><div class="flex items-center justify-center rounded-lg border-2 border-indigo-600 bg-indigo-50 px-4 py-3"><i class="fa-solid fa-user-graduate mr-2"></i><span class="text-sm font-medium">Student</span></div><div class="flex items-center justify-center rounded-lg border-2 border-gray-200 px-4 py-3 hover:bg-gray-50"><i class="fa-solid fa-chalkboard-teacher mr-2"></i><span class="text-sm font-medium">Teacher</span></div></div></div>
          <div><label class="mb-1 block text-sm font-medium text-gray-700">Password</label><input type="password" class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500" placeholder="••••••••"></div>
          <div><label class="mb-1 block text-sm font-medium text-gray-700">Confirm password</label><input type="password" class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500" placeholder="••••••••"></div>
          <button type="button" class="flex w-full items-center justify-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">Create Account</button>
        </form>
        <div class="mt-6 text-center"><p class="text-sm text-gray-600">Already have an account? <a href="./login.html" class="font-medium text-indigo-600 hover:text-indigo-500">Sign in</a></p></div>
      </div>
    </div>
  </div>
</body>
</html>
