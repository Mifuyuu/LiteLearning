server {
    listen 80;
    server_name litelearn.ikmcw.xyz;
    root /opt/litelearning/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    index index.php;
    charset utf-8;

    client_max_body_size 50M;
    client_body_buffer_size 128k;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # MinIO S3 storage (avatar/cover/submission files), proxied so URLs stay on https://litelearn.ikmcw.xyz
    location /s3/ {
        rewrite ^/s3/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Livewire uploads the browser directly to MinIO via presigned URLs (path-style: /{bucket}/{key}),
    # bypassing Laravel for the bytes. Pass those through untouched — no rewrite needed here.
    # The SigV4 signature is computed against Host "minio:9000" (AWS_ENDPOINT) at sign time, so the
    # proxied request must present that same Host or MinIO's signature check fails with 403.
    location /litelearning/ {
        proxy_pass http://127.0.0.1:9002;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        # php-fpm runs in a container where the app lives at /var/www/html — this path is
        # fixed regardless of nginx's own `root`, since the two processes see different filesystems.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    gzip on;
    gzip_types text/css application/javascript text/xml application/json image/svg+xml;
    gzip_vary on;

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/litelearning-access.log;
    error_log  /var/log/nginx/litelearning-error.log;
}
