server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    index index.php;

    charset utf-8;

    # Static files ตรง ๆ
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Storage files (avatar, cover, submissions)
    location /storage/ {
        try_files $uri $uri/ =404;
    }

    # Hotwire/Livewire turbo-stream
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Large uploads (สำหรับ multi-file assignment)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript text/xml application/json image/svg+xml;
    gzip_vary on;

    # Security
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/litelearning-access.log;
    error_log  /var/log/nginx/litelearning-error.log;
}
