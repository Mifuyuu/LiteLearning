services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: php
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ./.env:/var/www/html/.env:ro
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - litelearning

  queue:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: queue
    restart: unless-stopped
    user: www-data
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./.env:/var/www/html/.env:ro
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - litelearning

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: scheduler
    restart: unless-stopped
    user: www-data
    command: php artisan schedule:work
    volumes:
      - ./.env:/var/www/html/.env:ro
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - litelearning

  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - litelearning

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - litelearning

  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY};
      mc mb -p local/${AWS_BUCKET} || true;
      mc anonymous set download local/${AWS_BUCKET} || true;
      exit 0;
      "
    networks:
      - litelearning

volumes:
  mariadb_data:
  minio_data:
  storage_logs:

networks:
  litelearning:
    driver: bridge
