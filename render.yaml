services:
  - type: web
    name: litelearning
    env: php
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm install
      npm run build
    startCommand: |
      php artisan migrate --force
      php artisan serve --host=0.0.0.0 --port=$PORT
    disk:
      name: storage
      mountPath: /var/www/html/storage
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: litelearning-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: litelearning-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: litelearning-db
          property: name
      - key: DB_USERNAME
        fromDatabase:
          name: litelearning-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: litelearning-db
          property: password
      - key: FILESYSTEM_DISK
        value: local
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
