<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Background</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#F3F4F6;
    font-family:Inter,Arial,sans-serif;
}

#background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.icon{
    position:absolute;
    color:#9CA3AF;
    opacity:.06;
}

.icon svg{
    width:100%;
    height:100%;
    stroke:currentColor;
}

main{
    position:relative;
    z-index:5;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;
}

h1{
    font-size:64px;
    color:#111827;
}

p{
    margin-top:10px;
    color:#6B7280;
}
</style>

</head>

<body>

<div id="background"></div>

<main>

<div>
<h1>Space Landing Page</h1>
<p>Random Heroicons Background</p>
</div>

</main>

<script>

const icons = [

"rocket-launch",
"star",
"sparkles",
"moon",
"sun",
"globe-alt",
"cloud",
"bolt",
"fire",
"eye"

];

const background = document.getElementById("background");

const COUNT = 120;

const points = [];

function randomPoint(){

    while(true){

        const x = Math.random()*window.innerWidth;
        const y = Math.random()*window.innerHeight;

        let ok = true;

        for(const p of points){

            const dx = p.x-x;
            const dy = p.y-y;

            if(Math.sqrt(dx*dx+dy*dy)<60){

                ok=false;
                break;

            }

        }

        if(ok){

            points.push({x,y});

            return {x,y};

        }

    }

}

async function createBackground(){

    background.innerHTML="";
    points.length=0;

    for(let i=0;i<COUNT;i++){

        const name = icons[
            Math.floor(Math.random()*icons.length)
        ];

        const url =
`https://unpkg.com/@heroicons/svg@2.1.5/24/outline/${name}.svg`;

        try{

            const svg = await fetch(url).then(r=>r.text());

            const div = document.createElement("div");

            div.className="icon";

            div.innerHTML=svg;

            const {x,y}=randomPoint();

            const size =
                18 + Math.random()*38;

            const rotate =
                Math.random()*360;

            const opacity =
                0.03 + Math.random()*0.05;

            div.style.left=x+"px";
            div.style.top=y+"px";

            div.style.width=size+"px";
            div.style.height=size+"px";

            div.style.opacity=opacity;

            div.style.transform=
                `translate(-50%,-50%) rotate(${rotate}deg)`;

            background.appendChild(div);

        }catch(e){}

    }

}

createBackground();

window.addEventListener("resize",createBackground);

</script>

</body>
</html>
