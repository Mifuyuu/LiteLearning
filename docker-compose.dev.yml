services:
  # Nginx — reverse proxy สำหรับ Laravel
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html:delegated
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - litelearning

  # PHP-FPM — รัน Laravel
  php:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: php
    volumes:
      - .:/var/www/html:delegated
      - vendor:/var/www/html/vendor
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=local
      - APP_FAKER_LOCALE=en_US
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=litelearning
      - DB_USERNAME=litelearning
      - DB_PASSWORD=secret
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - MAIL_MAILER=log
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=litelearning
      - AWS_ENDPOINT=http://minio:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true
      - FILESYSTEM_DISK=s3
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - litelearning

  # Queue Worker — จำเป็นเพราะมี ShouldQueue
  queue:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: queue
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - .:/var/www/html:delegated
      - vendor:/var/www/html/vendor
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=litelearning
      - DB_USERNAME=litelearning
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=database
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - litelearning

  # Scheduler — รัน schedule:run ทุกนาที
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: scheduler
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html:delegated
      - vendor:/var/www/html/vendor
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=litelearning
      - DB_USERNAME=litelearning
      - DB_PASSWORD=secret
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - litelearning

  # MariaDB
  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: litelearning
      MYSQL_USER: litelearning
      MYSQL_PASSWORD: secret
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - litelearning

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - litelearning

  # MinIO Setup — สร้าง bucket
  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/litelearning || true;
      mc anonymous set download local/litelearning || true;
      exit 0;
      "
    networks:
      - litelearning

  # Mailpit — จับอีเมลที่ส่ง ตอนพัฒนา (localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - litelearning

volumes:
  minio_data:
  vendor:

networks:
  litelearning:
    driver: bridge
