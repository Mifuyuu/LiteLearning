services:
  # Database Service
  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    env_file:
      - .env.docker
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # phpMyAdmin Service
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: litelearning_user
      PMA_PASSWORD: secretpassword
    depends_on:
      - mariadb

  # MinIO (S3 Storage)
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO Setup (Buckets)
  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/litelearning || true;
      mc anonymous set download local/litelearning || true;
      exit 0;
      "

  # Scheduler — รัน Laravel scheduler (classwork:publish-scheduled ฯลฯ) ทุกนาที
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: scheduler
    restart: unless-stopped
    command: sh -c "composer install --no-interaction --prefer-dist --optimize-autoloader && php artisan schedule:work"
    volumes:
      - .:/var/www/html:delegated
      - scheduler_vendor:/var/www/html/vendor
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: litelearning
      DB_USERNAME: litelearning_user
      DB_PASSWORD: secretpassword
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Cloudflared (Tunnel)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    volumes:
      - ./config.yml:/etc/cloudflared/config.yml:ro
      - ./624ac4ba-f3dd-4735-bac6-f4cf2a8fb1f1.json:/etc/cloudflared/624ac4ba-f3dd-4735-bac6-f4cf2a8fb1f1.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mariadb_data:
  minio_data:
  scheduler_vendor:
